name: Distribute Android

# Manual by default: a beta build going out to real people should be a decision,
# not a side effect of merging. Uncomment the push trigger to ship every merge.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: What changed in this build
        required: true
        type: string
      groups:
        description: Firebase App Distribution tester groups (comma-separated)
        required: false
        default: friends
        type: string
  # push:
  #   branches: [main]

concurrency:
  group: distribute-android
  cancel-in-progress: false

jobs:
  distribute:
    name: Build and upload to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Never distribute a build that has not passed the suite — including the
      # daylight-saving run, which is the only one that can catch the streak
      # regression. See ci.yml for why.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test under a daylight-saving timezone
        env:
          TZ: America/Los_Angeles
        run: flutter test

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A debug-signed APK must not be distributed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Write Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase secrets missing. The app would boot straight into the configuration screen."
            exit 1
          fi
          # jq builds the JSON so a quote or backslash in a secret cannot break it.
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=env.json

      # Verified against a real debug-signed APK before being committed.
      #
      # It must be apksigner, not `keytool -printcert` or unzipping
      # META-INF/*.RSA: Flutter's APKs carry only v2/v3 signatures, so there is
      # no JAR signature block to read and those approaches silently find
      # nothing — passing a debug-signed APK straight through.
      - name: Confirm the APK is not debug-signed
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with debug keys — refusing to distribute."
            exit 1
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.groups }}
          releaseNotes: ${{ inputs.release_notes }}
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove credentials from the workspace
        if: always()
        run: rm -f env.json "$RUNNER_TEMP/release.jks"
